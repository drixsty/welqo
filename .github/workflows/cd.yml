# ─────────────────────────────────────────────────────────────
#  Welqo CD — Continuous Deployment
#  Triggers: push to main (after CI passes)
#  Strategy: 
#    - api        → Docker build + push to registry + deploy
#    - web-*      → Vercel deployment via CLI
# ─────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false   # Never cancel a running deploy

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── 1. Detect which apps changed ────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web-storefront: ${{ steps.filter.outputs.web-storefront }}
      web-dashboard: ${{ steps.filter.outputs.web-dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
            web-storefront:
              - 'apps/web-storefront/**'
              - 'packages/**'
            web-dashboard:
              - 'apps/web-dashboard/**'
              - 'packages/**'

  # ── 2. Deploy API (Docker → Registry → Server) ──────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run DB migrations on production
        run: |
          echo "Running Prisma migrations..."
          # Add your deployment command here (SSH, Fly.io, Railway, etc.)
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV

      - name: Deploy to production server
        run: |
          echo "Deploying API image: ${{ steps.meta.outputs.tags }}"
          # Example: Railway / Fly.io / SSH deploy command
          # fly deploy --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest

  # ── 3. Deploy web-storefront (Vercel) ───────────────────────
  deploy-storefront:
    name: Deploy Storefront
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web-storefront == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Deploy web-storefront to Vercel
        run: |
          npx vercel deploy apps/web-storefront \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STOREFRONT_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}

  # ── 4. Deploy web-dashboard (Vercel) ────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web-dashboard == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Deploy web-dashboard to Vercel
        run: |
          npx vercel deploy apps/web-dashboard \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}

  # ── 5. Post-deploy notifications ────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-storefront, deploy-dashboard]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| App | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Storefront | ${{ needs.deploy-storefront.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ needs.deploy-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
