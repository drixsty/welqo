slug: politique-de-confidentialite
titleFr: Politique de Confidentialité — Welqo
titleEn: Privacy Policy — Welqo
descriptionFr: Protection des données personnelles et conformité RGPD chez Welqo.
descriptionEn: Personal data protection and GDPR compliance policy at Welqo.
updatedAt: 2026-06-16
contentFr:
  - type: heading
    level: 2
    children:
      - text: 1. Responsable du traitement
  - type: paragraph
    children:
      - text: Lonside Corp. est le responsable du traitement de vos données
          personnelles. Pour toute question, vous pouvez contacter notre délégué
          à la protection des données (DPO) à dpo@welqo.fr. Une réponse vous
          sera apportée sous 48h ouvrées.
  - type: heading
    level: 2
    children:
      - text: 2. Données collectées
  - type: paragraph
    children:
      - text: "Nous collectons uniquement les données nécessaires pour vous fournir nos
          services de conciergerie Airbnb :"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Identification : Nom, prénom, adresse e-mail, numéro de téléphone."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Réservation : Dates de séjour, nombre de voyageurs, caractéristiques du
                  logement."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Paiement : Les données financières sont traitées de manière sécurisée par
                  Stripe."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Navigation : Adresse IP, cookies techniques, données de trafic."
  - type: heading
    level: 2
    children:
      - text: 3. Finalités du traitement
  - type: paragraph
    children:
      - text: "Vos données sont traitées pour les finalités suivantes :"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Gestion et facturation de vos réservations.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Envoi des instructions de check-in et informations transactionnelles
                  indispensables.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Optimisation de l'expérience utilisateur et de la performance du site.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Respect des obligations légales et comptables de Welqo.
  - type: heading
    level: 2
    children:
      - text: 4. Base légale
  - type: paragraph
    children:
      - text: Le traitement est fondé sur l'exécution du contrat de réservation, votre
          consentement pour les cookies non-techniques, et le respect de nos
          obligations légales.
  - type: heading
    level: 2
    children:
      - text: 5. Conservation
  - type: paragraph
    children:
      - text: Vos données de réservations sont conservées 5 ans. Les emails commerciaux
          sont supprimés après 3 ans d'inactivité. Les cookies analytiques ont
          une durée de vie de 13 mois maximum.
  - type: heading
    level: 2
    children:
      - text: 6. Vos droits
  - type: paragraph
    children:
      - text: Conformément au RGPD, vous disposez d'un droit d'accès, de rectification,
          de suppression, de limitation et de portabilité de vos données.
          Contactez dpo@welqo.fr. En cas de litige non résolu, vous pouvez
          saisir la CNIL.
contentEn:
  - type: heading
    level: 2
    children:
      - text: 1. Data Controller
  - type: paragraph
    children:
      - text: Lonside Corp. is the controller of your personal data. For any questions,
          please contact our Data Protection Officer (DPO) at dpo@welqo.fr. We
          will respond within 48 business hours.
  - type: heading
    level: 2
    children:
      - text: 2. Collected Data
  - type: paragraph
    children:
      - text: "We only collect data necessary to provide our Airbnb concierge services:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Identification: Last name, first name, email address, phone number."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Reservation: Stay dates, number of guests, property features."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Payment: Financial data is securely processed by Stripe."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Navigation: IP address, technical cookies, traffic data."
  - type: heading
    level: 2
    children:
      - text: 3. Purposes of Processing
  - type: paragraph
    children:
      - text: "Your data is processed for the following purposes:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Managing and billing your bookings.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Sending check-in instructions and essential transactional info.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Optimising user experience and website performance.
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: Complying with Welqo's legal and accounting obligations.
  - type: heading
    level: 2
    children:
      - text: 4. Legal Basis
  - type: paragraph
    children:
      - text: Processing is based on contract performance, your consent for
          non-technical cookies, and compliance with our legal obligations.
  - type: heading
    level: 2
    children:
      - text: 5. Data Retention
  - type: paragraph
    children:
      - text: Your booking data is retained for 5 years. Marketing emails are deleted
          after 3 years of inactivity. Analytical cookies have a lifespan of
          maximum 13 months.
  - type: heading
    level: 2
    children:
      - text: 6. Your Rights
  - type: paragraph
    children:
      - text: In accordance with GDPR, you have the right to access, rectify, delete,
          restrict, and export your data. Contact dpo@welqo.fr. For unresolved
          disputes, you may contact the CNIL.
