slug: politique-de-cookies
titleFr: Politique de Cookies — Welqo
titleEn: Cookies Policy — Welqo
descriptionFr: Utilisation des cookies techniques et analytiques sur le site Welqo.
descriptionEn: Technical and analytical cookies usage policy at Welqo.
updatedAt: 2026-06-16
contentFr:
  - type: heading
    level: 2
    children:
      - text: 1. Qu'est-ce qu'un cookie ?
  - type: paragraph
    children:
      - text: Un cookie est un petit fichier texte déposé sur votre appareil
          (ordinateur, mobile ou tablette) lors de la visite d'un site internet.
          Il permet au site de mémoriser vos actions et préférences pour
          faciliter votre navigation.
  - type: heading
    level: 2
    children:
      - text: 2. Quels types de cookies utilisons-nous ?
  - type: paragraph
    children:
      - text: "Nous utilisons deux types de cookies en 2026 :"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Cookies techniques nécessaires : indispensables pour mémoriser votre
                  langue de préférence (FR/EN) et sécuriser votre paiement via
                  Stripe."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Cookies analytiques : pour suivre de manière anonyme les statistiques de
                  trafic et améliorer les performances de notre site."
  - type: heading
    level: 2
    children:
      - text: 3. Comment gérer ou désactiver vos cookies ?
  - type: paragraph
    children:
      - text: Vous pouvez désactiver l'utilisation des cookies facultatifs à tout moment
          en ajustant les paramètres de votre navigateur web ou en déclinant le
          consentement via notre bannière de cookies.
contentEn:
  - type: heading
    level: 2
    children:
      - text: 1. What is a cookie?
  - type: paragraph
    children:
      - text: A cookie is a small text file stored on your device (computer, mobile, or
          tablet) when you visit a website. It allows the site to remember your
          actions and preferences to facilitate your navigation.
  - type: heading
    level: 2
    children:
      - text: 2. What types of cookies do we use?
  - type: paragraph
    children:
      - text: "We use two types of cookies in 2026:"
  - type: unordered-list
    children:
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Necessary technical cookies: essential for remembering your preferred
                  language (FR/EN) and securing your payments via Stripe."
      - type: list-item
        children:
          - type: paragraph
            children:
              - text: "Analytical cookies: to anonymously track traffic stats and improve
                  website performance."
  - type: heading
    level: 2
    children:
      - text: 3. How to manage or disable cookies?
  - type: paragraph
    children:
      - text: You can disable the use of optional cookies at any time by adjusting your
          web browser settings or by declining consent through our cookie
          consent banner.
